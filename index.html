<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        <div id="start-screen" class="screen">
            <h1 class="title">Quiz</h1>
            <button class="start-btn">Грати</button>
        </div>
        <div id="game-screen" class="screen hide">
            <div class="jheader">
                <span id="timer">Час 15</span>
                <span id="score-display">Бали: 0</span>
            </div>
            <h2 id="question-text"></h2>
            <div id="answers-container"></div>
        </div>
        <div id="result-screen" class="screen hide">
            <p id="result">Ви набрали 20 балів</p>
            <button class="start-btn">Знову</button>
        </div>
    </div>
</body>
</html>
